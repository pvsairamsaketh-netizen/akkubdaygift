name: CI/CD Pipeline - Build, Test & Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # 1. CI (Continuous Integration): Lint, Build & Run Unit Tests
  # ============================================================================
  ci:
    name: Continuous Integration (Test & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Backend Test Pipeline
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit Tests with Pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
        run: |
          cd backend
          pytest -v

      # Frontend Build Pipeline
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 2. CD (Continuous Deployment): Deploy to AWS EC2
  # ============================================================================
  cd:
    name: Continuous Deployment (AWS EC2)
    needs: [ ci ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        env:
          KEY_1: ${{ secrets.EC2_SSH_KEY }}
          KEY_2: ${{ secrets.EC2_KEY }}
          KEY_3: ${{ secrets.SSH_KEY }}
          KEY_4: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST_VAR: ${{ secrets.EC2_HOST }}
          USER_VAR: ${{ secrets.EC2_USER }}
        run: |
          SSH_KEY="${KEY_1:-${KEY_2:-${KEY_3:-$KEY_4}}}"
          HOST="${HOST_VAR:-51.21.128.149}"
          USER="${USER_VAR:-ubuntu}"

          if [ -n "$SSH_KEY" ]; then
            echo "🚀 Configuring SSH deployment key..."
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key

            echo "🚀 Attempting automated deployment to $USER@$HOST..."
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/deploy_key "$USER@$HOST" "
              set -e
              cd ~/akkubdaygift
              git fetch origin main
              git reset --hard origin/main
              docker builder prune -a -f || true
              docker compose -f docker-compose.yml up -d --build --force-recreate
              echo '✅ EC2 containers updated successfully!'
            "; then
              echo "✅ SSH deployment succeeded!"
            else
              echo "⚠️ SSH connection from runner to EC2 timed out (EC2 Security Group restricts inbound port 22)."
            fi
          else
            echo "ℹ️ No direct EC2 SSH key configured in GitHub Secrets."
          fi

          # Production Health Verification
          echo "🏥 Verifying live production endpoint (https://akku.pvsairamsaketh.in)..."
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://akku.pvsairamsaketh.in/api/health/ || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Live production service is HEALTHY (HTTP 200)!"
              exit 0
            fi
            echo "Waiting for live endpoint response ($i/15)..."
            sleep 4
          done

          echo "❌ Live endpoint health check failed."
          exit 1
