name: CI/CD Pipeline - Build, Test & Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # 1. CI (Continuous Integration): Lint, Build & Run Unit Tests
  # ============================================================================
  ci:
    name: Continuous Integration (Test & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Backend Test Pipeline
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit Tests with Pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
        run: |
          cd backend
          pytest -v

      # Frontend Build Pipeline
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 2. CD (Continuous Deployment): Build & Deploy to AWS EC2 via SSH
  # ============================================================================
  cd:
    name: Continuous Deployment (AWS EC2)
    needs: [ ci ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting automated deployment on AWS EC2..."
            
            cd ~/akkubdaygift
            git fetch origin main
            git reset --hard origin/main

            # Prune old build cache to preserve EC2 disk space
            docker builder prune -a -f || true
            docker image prune -f || true

            # Build and launch updated containers
            echo "🔄 Launching updated containers with docker compose..."
            docker compose -f docker-compose.yml up -d --build --remove-orphans

            # Automated Health Check
            echo "🏥 Running deployment health check..."
            for i in {1..20}; do
              if curl -s -f http://localhost:8085/api/health/ > /dev/null; then
                echo "✅ Deployment SUCCESSFUL! Health check passed."
                exit 0
              fi
              echo "Waiting for backend service to become ready ($i/20)..."
              sleep 3
            done

            echo "❌ Health check timed out! Container logs:"
            docker compose -f docker-compose.yml logs --tail=60
            exit 1
