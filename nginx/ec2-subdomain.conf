# ==============================================================================
# Nginx Host Configuration for Saki & Akku Birthday Surprise Application
# Place in: /etc/nginx/sites-available/akku.pvsairamsaketh.in
# Symlink to: /etc/nginx/sites-enabled/akku.pvsairamsaketh.in
#
# This allows akku.pvsairamsaketh.in to run alongside your existing project
# at pvsairamsaketh.in without ANY conflict or downtime!
# ==============================================================================

server {
    listen 80;
    server_name akku.pvsairamsaketh.in;

    client_max_body_size 50M;

    location / {
        # Proxy to the Docker container port mapped in docker-compose.prod.yml
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming support for real-time SSE AI chat
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
